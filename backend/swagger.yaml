# =============================================================================
# TodoList 백엔드 REST API 명세 (OpenAPI 3.0.3)
# =============================================================================
#
# 문서 버전: v0.4
#
# 버전 이력
#
# | 버전 | 일자       | 작성자 | 상태 | 비고      |
# |------|------------|--------|------|-----------|
# | v0.1 | 2026-11-04 | Claude | 초안 | 최초 작성 |
# | v0.2 | 2026-11-04 | Claude | 초안 | 미정의 사항 결정 반영 |
# | v0.3 | 2026-11-04 | Claude | 초안 | 스키마 파일 경로 갱신 |
# | v0.4 | 2026-11-05 | Claude | 초안 | 현재 백엔드 구현 반영, 개발 환경 Swagger UI |
#
# 변경 이력
#
# | 버전 | 일자       | 작성자 | 변경 내용                         |
# |------|------------|--------|-----------------------------------|
# | v0.1 | 2026-11-04 | Claude | docs/ 문서 기반 최초 작성         |
# | v0.2 | 2026-11-04 | Claude | 미정의 11건 결정 반영: 로그인·이름 수정·카테고리 수정 응답 본문, 비밀번호 변경 204, `currentPassword`/`newPassword` 확정, 본문 한도 초과 400, 쿼리 형식 오류 400, 비밀번호 trim 예외, `null` 규칙(PD-27), 시각 형식(PD-28), Todo 스키마 통일·`categoryName`(PD-29), 근거 문서 버전 갱신 |
# | v0.3 | 2026-11-04 | Claude | 근거 문서의 스키마 경로를 `docs/schema.sql` → `backend/sql/schema.sql`로 변경(T-DB-02) |
# | v0.4 | 2026-11-05 | Claude | `/api/health`에 DB 연결 상태(200 `db: up` / 503 `db: down`) 추가, `servers`를 상대 경로로 변경(개발 환경 Swagger UI, PD-30). `/api/docs` 경로 추가, 예시 오류 문구를 실제 응답과 일치시킴, 완료 토글 예시의 `updatedAt` 갱신, 근거 문서 버전 갱신 |
#
# 근거 문서 (충돌 시 위 문서가 우선)
#
# | 문서                              | 버전 |
# |-----------------------------------|------|
# | docs/1-domain-definition.md       | v0.7 |
# | docs/2-PRD.md                     | v0.14 |
# | docs/3-user-scenario.md           | v0.10 |
# | docs/4-wireframe.md               | v0.5 |
# | docs/5-project-principle.md       | v0.9 |
# | docs/6-arch-diagram.md            | v0.7 |
# | docs/7-erd.md                     | v0.4 |
# | docs/schema.sql                   | (버전 없음, 머리말 기준 ERD v0.4) |
# | docs/8-plan.md                    | v0.6 |
#
# 운영 원칙
# - 경로·메서드는 구조 설계 원칙 7.2 표(PRD P-25 위임)가 단일 출처다. 이 파일은 그 표를 옮긴 것이며,
#   문서가 바뀌면 문서를 먼저 고치고 이 파일의 변경 이력을 남긴다(PR-C-08).
# - 오류 코드는 PRD NFR-15에 정의된 것만 쓴다.
# - 문서에 정의가 없는 항목은 description에 '미정의'로 표시한다.
# =============================================================================

openapi: 3.0.3

info:
  title: TodoList API
  version: v0.4
  description: |
    개인 할일(기간·카테고리)과 월/주/일 캘린더 조회를 위한 백엔드 REST API.

    **공통 규약**
    - 모든 경로는 `/api` 접두사를 쓰고 JSON 필드·쿼리 파라미터는 camelCase다(PR-N-05, PR-N-06).
    - 날짜는 `YYYY-MM-DD` 문자열로 주고받는다(NFR-11, PR-C-05).
    - 문자열 입력은 앞뒤 공백을 제거(trim)한 뒤 검사하며, 필수 항목이 빈 문자열이면 누락으로 본다. 단, 비밀번호는 trim하지 않고 공백도 유효한 문자로 본다(BR-22, PR-S-07).
    - 요청 본문은 JSON만 받고 크기 한도는 16kb다(PR-S-03, PR-S-07). 한도 초과(`express.json`의 413 `entity.too.large`)와 JSON 파싱 실패는 오류 미들웨어가 400 `VALIDATION_ERROR`로 바꾼다(PR-S-07, T-BE-03).
    - 쿼리 파라미터(`categoryId`·`status`·`today`·`from`·`to`)의 형식 오류는 400 `VALIDATION_ERROR`다(PD-13).
    - 요청 본문의 `null`은 NULL 허용 컬럼에 대응하는 필드(할일 `description`)에만 허용한다. 등록에서 `null`은 생략과 같고, 수정에서 `null`은 값을 비운다. 그 밖의 필드에 `null`을 보내면 400 `VALIDATION_ERROR`다(PD-27).
    - 시각 필드(`createdAt`·`updatedAt`·`completedAt`)는 ISO 8601 UTC, `toISOString()` 형식(`2026-11-04T09:00:00.000Z`)이다(PD-28).
    - 알 수 없는 `/api` 경로는 404 `NOT_FOUND`다(T-BE-03).
    - 경로의 `:id`는 정수이며, 정수가 아닌 값은 존재하지 않는 것으로 보아 404 `NOT_FOUND`다(PD-13, P-25).
    - 성공 상태 코드: 생성 201(생성된 객체), 삭제·로그아웃·토큰 갱신 204(본문 없음), 그 외 200(PD-25).
    - 오류 판정 순서: 인증(401) → 입력 형식·값(400 `VALIDATION_ERROR`) → 존재·소유권(404) → 규칙(400 `DEFAULT_CATEGORY_IMMUTABLE`·`INVALID_PASSWORD`) → 중복(409)(PD-22).
    - 타인의 데이터는 존재하지 않는 경우와 같은 404 `NOT_FOUND`로 응답한다(BR-03, NFR-07).
    - 할일 상태(`status`)는 저장하지 않고 요청의 `today`로 서버가 파생한다(NFR-12, P-12).

    **인증(P-04, PR-S-03)**
    - access 토큰: JWT(HS384, 페이로드 `sub`=사용자 ID만, 만료 15분). 쿠키 `access_token`(httpOnly, `SameSite=Lax`, `Path=/`, `Max-Age=900`).
    - refresh 토큰: 불투명 난수(base64url, JWT 아님, 만료 7일). 쿠키 `refresh_token`(httpOnly, `SameSite=Lax`, `Path=/api/auth`, `Max-Age=604800`). DB에는 SHA-256 해시만 저장한다(DB-13).
    - `Secure` 속성은 `NODE_ENV=production`일 때만 붙는다.
    - 공개 API: `POST /api/auth/signup`, `POST /api/auth/login`, `POST /api/auth/refresh`, `POST /api/auth/logout`, `GET /api/health`, 개발 환경 한정 `GET /api/docs`·`GET /api/docs/swagger.yaml`(PD-30). 그 밖의 모든 API는 `access_token` 쿠키가 필요하며, 없거나 만료·위조면 401 `UNAUTHORIZED`다(PR-S-05, FR-04).
    - CORS: `CORS_ORIGIN`(개발 기본 http://localhost:5173) 출처 하나만 자격 증명(쿠키) 포함 요청을 허용한다(PR-S-04). 프론트는 `credentials: 'include'`로 호출한다.

    **오류 코드 카탈로그(NFR-15)**

    | 상태 | code | 의미 |
    |---|---|---|
    | 400 | `VALIDATION_ERROR` | 입력 위반. `fields`에 항목별 사유 |
    | 400 | `DEFAULT_CATEGORY_IMMUTABLE` | 기본 카테고리 이름 변경·삭제 시도(BR-12) |
    | 400 | `INVALID_PASSWORD` | 비밀번호 변경 시 현재 비밀번호 불일치(BR-05) |
    | 401 | `UNAUTHORIZED` | access 토큰 없음·만료·위조, refresh 토큰 무효 |
    | 401 | `INVALID_CREDENTIALS` | 로그인 실패(이메일·비밀번호 구분 없음) |
    | 404 | `NOT_FOUND` | 없음 또는 타인 소유 |
    | 409 | `DUPLICATE_EMAIL` | 이메일 중복(BR-02) |
    | 409 | `DUPLICATE_CATEGORY` | 카테고리 이름 중복(BR-13) |
    | 500 | `INTERNAL_ERROR` | 서버 내부 오류(상세 비노출) |

    오류 `message`의 실제 문구는 문서가 정하지 않는다(와이어프레임 머리말). 이 명세의 예시 문구는 설명용이다.

servers:
  - url: /
    description: 지금 연 서버와 같은 출처. 로컬 백엔드는 http://localhost:3000 (P-10). 프론트(http://localhost:5173)는 CORS로 직접 호출한다(PR-S-04). 개발 환경에서 Swagger UI는 /api/docs (PD-30).

tags:
  - name: auth
    description: 회원가입·로그인·토큰 갱신·로그아웃(FR-01~04, P-04)
  - name: me
    description: 내 정보(FR-14, FR-15)
  - name: categories
    description: 카테고리 관리(FR-13)
  - name: todos
    description: 할일 등록·조회·수정·삭제·완료(FR-05~09)
  - name: calendar
    description: 캘린더 기간 조회(FR-10~12)
  - name: health
    description: 기동·DB 연결 확인(P-25, PD-14)
  - name: docs
    description: API 문서(개발 환경 한정, PD-30)

security:
  - cookieAuth: []

paths:
  /api/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: 회원가입(자동 로그인)
      description: |
        이메일·비밀번호·이름으로 가입한다. 사용자, '기본' 카테고리(`isDefault=true`), refresh 토큰을 한 트랜잭션으로 만들고(NFR-10, BR-10, PR-L-06) 토큰 쌍 쿠키를 발급한다(자동 로그인).
        이메일은 trim 후 소문자로 저장한다(DB-03). 비밀번호 확인값은 화면에서만 검사하며 서버로 보내지 않는다(P-24).

        관련 ID: FR-01, UC-01, BR-02, BR-10, BR-21, BR-22, NFR-06, NFR-09, NFR-10, P-04, SD-01, T-BE-08, SC-01, E-01-1~3
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: user1@example.com
              password: password1234
              name: 홍길동
      responses:
        '201':
          description: 가입 성공. 생성된 사용자(비밀번호 해시 제외)와 토큰 쌍 쿠키.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user1@example.com
                name: 홍길동
                createdAt: '2026-11-04T01:00:00.000Z'
                updatedAt: '2026-11-04T01:00:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '409':
          description: 이메일 중복(대소문자만 다른 경우 포함, BR-02, DB-03). 사용자는 생성되지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_EMAIL
                  message: 이미 가입된 이메일입니다.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 로그인(토큰 쌍 발급)
      description: |
        이메일(소문자로 비교, DB-03)과 비밀번호로 인증하고 토큰 쌍 쿠키를 발급한다. 성공 시 그 사용자의 만료된 refresh 토큰 행을 정리한다(DB-13).
        이메일 없음과 비밀번호 틀림을 구분하지 않는다.

        응답 본문은 가입과 같은 사용자다(PD-25, PD-29). 이메일·비밀번호 누락은 400 `VALIDATION_ERROR`다(FR-02).

        관련 ID: FR-02, UC-02, BR-01, P-04, PD-25, PD-29, SD-02, T-BE-04, T-BE-08, SC-02, E-02-1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user1@example.com
              password: password1234
      responses:
        '200':
          description: 로그인 성공. 사용자와 토큰 쌍 쿠키.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user1@example.com
                name: 홍길동
                createdAt: '2026-11-04T01:00:00.000Z'
                updatedAt: '2026-11-04T01:00:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          description: 이메일 또는 비밀번호 불일치. 쿠키를 발급하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: 토큰 갱신(refresh 토큰 회전)
      description: |
        `refresh_token` 쿠키의 해시가 일치하고 만료되지 않은 행을 한 문장으로 삭제(`DELETE … RETURNING user_id`)한 뒤 새 토큰 쌍을 발급한다(회전, 재사용 불가).
        access 토큰 없이 refresh 쿠키만으로 동작한다(인증 경계 제외). 같은 refresh 토큰으로 동시에 호출하면 하나만 성공하고 나머지는 401이다(PD-26).
        요청 본문은 없다.

        관련 ID: P-04, FR-04, NFR-02, PR-S-03, PR-S-05, PR-L-12, PD-25, PD-26, DB-13, SD-02, T-BE-16
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookie'
      responses:
        '204':
          description: 갱신 성공. 새 토큰 쌍 쿠키 발급, 본문 없음.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          description: refresh 토큰 쿠키 없음·만료·DB에 없음(이미 사용됨 포함). 두 쿠키를 같은 옵션으로 삭제한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 로그아웃
      description: |
        `refresh_token` 쿠키에 해당하는 행을 삭제하고 두 쿠키를 같은 옵션으로 삭제한다. 쿠키가 없거나 이미 무효여도 204다(T-BE-08).
        access 토큰 블랙리스트는 두지 않는다(P-04). 요청 본문은 없다.

        관련 ID: FR-03, UC-02, P-04, PR-S-03, PR-S-05, PD-25, T-BE-08, SC-02
      security: []
      parameters:
        - $ref: '#/components/parameters/RefreshTokenCookieOptional'
      responses:
        '204':
          description: 로그아웃 완료. 두 쿠키 삭제, 본문 없음.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearAuthCookies'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 정보 조회(로그인 확인)
      description: |
        로그인한 사용자 정보를 돌려준다. 화면 첫 진입 시 로그인 여부 확인에 쓴다(P-25, PD-24). 비밀번호 해시는 포함하지 않는다(PR-S-06).

        관련 ID: FR-14, P-25, PD-24, FR-04, T-BE-09
      responses:
        '200':
          description: 사용자 정보.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user1@example.com
                name: 홍길동
                createdAt: '2026-11-04T01:00:00.000Z'
                updatedAt: '2026-11-04T01:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [me]
      operationId: updateMe
      summary: 이름 수정
      description: |
        본인 이름을 수정한다(Should). 이메일은 변경할 수 없으며 본문에 `email`이 있어도 무시한다(BR-05, PR-S-07).

        응답은 수정된 사용자다(PD-25, PD-29). `name: null`은 400이다(PD-27).

        관련 ID: FR-14, UC-03, BR-05, BR-22, PD-25, PD-27, PD-29, T-BE-15, SC-11, E-11-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              name: 김철수
      responses:
        '200':
          description: 수정된 사용자.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 1
                email: user1@example.com
                name: 김철수
                createdAt: '2026-11-04T01:00:00.000Z'
                updatedAt: '2026-11-04T06:00:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/me/password:
    put:
      tags: [me]
      operationId: changePassword
      summary: 비밀번호 변경
      description: |
        현재 비밀번호를 확인하고 새 비밀번호로 바꾼다(Should). 성공하면 그 사용자의 refresh 토큰을 모두 삭제해 다른 세션을 무효화하고, 현재 요청에 새 토큰 쌍 쿠키를 발급해 현재 세션은 유지한다(P-04).
        현재 비밀번호가 틀리면 400 `INVALID_PASSWORD`이며 로그아웃되지 않는다. 새 비밀번호 확인값은 화면에서만 검사한다(P-24).

        비밀번호는 trim하지 않는다(BR-22). 성공 응답은 204이며 본문이 없다(PD-25).

        관련 ID: FR-15, UC-03, BR-05, BR-21, BR-22, P-04, P-24, PD-25, T-BE-15, SC-11, E-11-2, E-11-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: password1234
              newPassword: newpassword5678
      responses:
        '204':
          description: 변경 성공, 본문 없음. 다른 세션의 refresh 토큰 폐기, 현재 세션에 새 토큰 쌍 쿠키 발급.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '400':
          description: |
            입력 위반(`VALIDATION_ERROR`: 새 비밀번호 BR-21 위반, `null`, JSON 파싱 실패, 본문 16kb 초과 등) 또는 현재 비밀번호 불일치(`INVALID_PASSWORD`). 변경되지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: 새 비밀번호 길이 위반(E-11-3)
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요.
                      fields:
                        newPassword: 8자 이상 64자 이하여야 합니다.
                invalidPassword:
                  summary: 현재 비밀번호 틀림(E-11-2)
                  value:
                    error:
                      code: INVALID_PASSWORD
                      message: 현재 비밀번호가 올바르지 않습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: 카테고리 목록
      description: |
        본인 카테고리 전체. 기본 카테고리가 맨 앞, 나머지는 생성 시각 오름차순(동일 시 `id`)이다(BR-23, T-BE-10). 페이지네이션 없음.

        관련 ID: FR-13, UC-04, BR-03, BR-23, T-BE-10, SC-03
      responses:
        '200':
          description: 카테고리 목록(BR-23 순서).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
              example:
                - id: 1
                  name: 기본
                  isDefault: true
                  createdAt: '2026-11-04T01:00:00.000Z'
                  updatedAt: '2026-11-04T01:00:00.000Z'
                - id: 2
                  name: 업무
                  isDefault: false
                  createdAt: '2026-11-04T01:05:00.000Z'
                  updatedAt: '2026-11-04T01:05:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [categories]
      operationId: createCategory
      summary: 카테고리 등록
      description: |
        이름은 trim 후 저장하며 같은 사용자 안에서 대소문자를 구분해 유일하다('기본' 포함, BR-13, DB-04). `isDefault`는 받지 않는다.

        관련 ID: FR-13, UC-04, BR-13, BR-22, PD-25, T-BE-10, SC-03, E-03-1, E-03-3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameRequest'
            example:
              name: 업무
      responses:
        '201':
          description: 생성된 카테고리.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 2
                name: 업무
                isDefault: false
                createdAt: '2026-11-04T01:05:00.000Z'
                updatedAt: '2026-11-04T01:05:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateCategory'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: 카테고리 이름 수정
      description: |
        판정 순서: 입력(400) → 존재·소유권(404) → 기본 카테고리(400 `DEFAULT_CATEGORY_IMMUTABLE`) → 중복(409)(PD-22).

        응답은 수정된 카테고리다(PD-25).

        관련 ID: FR-13, UC-04, BR-03, BR-12, BR-13, BR-22, PD-22, PD-25, T-BE-10, E-03-1~3, E-C2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameRequest'
            example:
              name: 회사 업무
      responses:
        '200':
          description: 수정된 카테고리.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
              example:
                id: 2
                name: 회사 업무
                isDefault: false
                createdAt: '2026-11-04T01:05:00.000Z'
                updatedAt: '2026-11-04T06:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationOrDefaultCategoryError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DuplicateCategory'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: 카테고리 삭제(소속 할일은 기본으로 이동)
      description: |
        소속 할일을 기본 카테고리로 옮긴 뒤 카테고리를 삭제한다(한 트랜잭션, BR-14, NFR-10). 할일은 삭제되지 않는다.
        판정 순서: 존재·소유권(404) → 기본 카테고리(400)(PD-22). 타인의 기본 카테고리는 404다.

        관련 ID: FR-13, UC-04, BR-03, BR-12, BR-14, NFR-10, PD-22, PD-25, SD-06, T-BE-10, SC-03, E-03-2, E-C2
      responses:
        '204':
          description: 삭제 완료, 본문 없음.
        '400':
          description: 기본 카테고리 삭제 시도(BR-12). 변경 없음.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DEFAULT_CATEGORY_IMMUTABLE
                  message: 기본 카테고리는 수정하거나 삭제할 수 없습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos:
    get:
      tags: [todos]
      operationId: listTodos
      summary: 할일 목록(필터)
      description: |
        본인 할일 목록. 각 항목에 서버가 `today`로 판정한 `status`와 카테고리 이름(`categoryName`)을 포함한다.
        카테고리 필터와 상태 필터는 AND로 결합하고, 지정하지 않으면 전체다(BR-15). 정렬은 종료일 → `createdAt` → `id` 오름차순(BR-20, PR-L-08). 페이지네이션 없음(P-11).
        판정 순서: 입력(400) → 카테고리 소유권(404)(PD-22).

        관련 ID: FR-09, UC-09, BR-03, BR-15, BR-20, ST-01~04, P-11, P-12, P-14, PD-17, PD-19, SD-03, T-BE-12, SC-08, E-08-1~3
      parameters:
        - $ref: '#/components/parameters/Today'
        - name: categoryId
          in: query
          required: false
          description: |
            카테고리 필터(본인 카테고리 ID). 정수가 아니면 400 `VALIDATION_ERROR`(PD-13), 본인 카테고리가 아니거나 없으면 404 `NOT_FOUND`(P-14).
          schema:
            type: integer
          example: 2
        - name: status
          in: query
          required: false
          description: 상태 필터(단일 값, PD-19). 다른 값은 400 `VALIDATION_ERROR`(P-14).
          schema:
            $ref: '#/components/schemas/TodoStatus'
          example: in_progress
      responses:
        '200':
          description: 상태가 포함된 할일 목록(BR-20 순서). 0건이면 빈 배열.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
              example:
                - id: 1
                  categoryId: 2
                  categoryName: 업무
                  title: 분기 보고서 작성
                  description: null
                  startDate: '2026-10-28'
                  endDate: '2026-11-03'
                  completed: false
                  completedAt: null
                  status: overdue
                  createdAt: '2026-10-27T01:00:00.000Z'
                  updatedAt: '2026-10-27T01:00:00.000Z'
                - id: 4
                  categoryId: 1
                  categoryName: 기본
                  title: 장보기
                  description: 우유, 계란
                  startDate: '2026-11-04'
                  endDate: '2026-11-04'
                  completed: true
                  completedAt: '2026-11-04T03:00:00.000Z'
                  status: completed
                  createdAt: '2026-11-04T01:00:00.000Z'
                  updatedAt: '2026-11-04T03:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [todos]
      operationId: createTodo
      summary: 할일 등록
      description: |
        `categoryId`를 생략하면 기본 카테고리에 저장한다(BR-11). 지정한 카테고리가 본인 것이 아니거나 없으면 404(BR-04).
        과거 날짜도 저장된다(BR-08). 설명이 trim 후 빈 문자열이면 `null`로 저장한다(DB-11). 응답은 `categoryName`을 포함하고 상태는 포함하지 않는다(PD-29). `description: null`은 생략과 같다(PD-27).

        관련 ID: FR-05, UC-05, BR-04, BR-06, BR-07, BR-08, BR-11, BR-22, PD-25, SD-07, T-BE-11, SC-04, E-04-1~4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: 분기 보고서 작성
              description: 3분기 실적 정리
              startDate: '2026-11-04'
              endDate: '2026-11-10'
              categoryId: 2
      responses:
        '201':
          description: 생성된 할일(`categoryName` 포함, 상태 미포함, PD-29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 5
                categoryId: 2
                categoryName: 업무
                title: 분기 보고서 작성
                description: 3분기 실적 정리
                startDate: '2026-11-04'
                endDate: '2026-11-10'
                completed: false
                completedAt: null
                createdAt: '2026-11-04T02:00:00.000Z'
                updatedAt: '2026-11-04T02:00:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todos]
      operationId: getTodo
      summary: 할일 단건 조회(편집 화면)
      description: |
        편집 화면 직접 접근용. `today`를 받지 않고 상태를 포함하지 않는다(PD-13, P-25).

        관련 ID: FR-06, P-25, PD-13, T-BE-11, E-C2
      responses:
        '200':
          description: 할일(`categoryName` 포함, 상태 미포함, PD-29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [todos]
      operationId: updateTodo
      summary: 할일 수정
      description: |
        편집 폼의 값 전체를 보낸다: `title`·`startDate`·`endDate` 필수, `description`·`categoryId` 선택(PD-20). `categoryId`·`description`을 생략하면 기존 값을 유지한다(BR-11, PD-20). 설명을 비우려면 `null` 또는 빈 문자열을 보낸다.
        `description: null`이면 설명을 비우고, `categoryId`·`title` 등 NOT NULL 필드의 `null`은 400이다(PD-27).
        BR-07은 본문의 두 날짜만으로 판정한다. 판정 순서: 입력(400) → 할일 존재·소유권(404) → 카테고리 소유권(404)(PD-22).

        관련 ID: FR-06, UC-06, BR-03, BR-04, BR-06, BR-07, BR-08, BR-11, BR-22, PD-20, PD-22, SD-07, T-BE-11, SC-05, E-05-1, E-05-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
            example:
              title: 분기 보고서 작성(수정)
              description: ''
              startDate: '2026-11-04'
              endDate: '2026-11-12'
      responses:
        '200':
          description: 수정된 할일(`categoryName` 포함, 상태 미포함, SD-07, PD-29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [todos]
      operationId: deleteTodo
      summary: 할일 삭제
      description: |
        물리 삭제이며 복구할 수 없다(BR-09).

        관련 ID: FR-08, UC-08, BR-03, BR-09, PD-25, T-BE-11, SC-07, E-07-1
      responses:
        '204':
          description: 삭제 완료, 본문 없음.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/todos/{id}/completed:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    patch:
      tags: [todos]
      operationId: setTodoCompleted
      summary: 할일 완료 / 완료 취소
      description: |
        원하는 완료 여부를 보낸다(서버 반전 아님). `true`면 `completedAt`을 현재 시각으로(이미 완료면 유지), `false`면 `null`로 한다. 같은 값을 다시 보내도 오류가 아니다(멱등, PD-21).
        응답은 상태를 포함하지 않는 할일이며, 화면은 목록·캘린더를 다시 조회해 상태를 표시한다(P-15).

        관련 ID: FR-07, UC-07, BR-03, ST-01~04, PD-21, PD-25, DB-08, SD-05, T-BE-11, SC-06, E-06-1, E-06-2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletedRequest'
            example:
              completed: true
      responses:
        '200':
          description: 변경된 할일(`categoryName` 포함, 상태 미포함, PD-29).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
              example:
                id: 2
                categoryId: 1
                categoryName: 기본
                title: 운동
                description: null
                startDate: '2026-11-01'
                endDate: '2026-11-07'
                completed: true
                completedAt: '2026-11-04T05:00:00.000Z'
                createdAt: '2026-10-31T01:00:00.000Z'
                updatedAt: '2026-11-04T05:00:00.000Z'
        '400':
          $ref: '#/components/responses/BodyValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      summary: 캘린더 기간 조회(월·주·일 공통)
      description: |
        `[from, to]` 기간과 하루라도 겹치는(`startDate <= to AND endDate >= from`) 본인 할일을 완료 포함 모든 상태로 돌려준다(BR-16~19).
        월 뷰는 1일~말일, 주 뷰는 일요일~토요일, 일 뷰는 `from = to`로 호출한다(기간 계산은 프론트, SD-04). 정렬은 BR-20.

        관련 ID: FR-10, FR-11, FR-12, UC-10, BR-16, BR-17, BR-18, BR-19, BR-20, P-12, P-14, SD-04, T-BE-13, SC-09, SC-10, E-09-1, E-09-2
      parameters:
        - name: from
          in: query
          required: true
          description: 조회 기간 시작일(`YYYY-MM-DD`, 실제 날짜). `from > to`면 400(P-14).
          schema:
            $ref: '#/components/schemas/Date'
          example: '2026-11-01'
        - name: to
          in: query
          required: true
          description: 조회 기간 종료일(`YYYY-MM-DD`, 실제 날짜).
          schema:
            $ref: '#/components/schemas/Date'
          example: '2026-11-30'
        - $ref: '#/components/parameters/Today'
      responses:
        '200':
          description: 기간과 겹치는 할일(상태 포함, BR-20 순서). 0건이면 빈 배열.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: 헬스 체크
      description: |
        인증 없이 기동 여부와 DB 연결을 확인한다. `SELECT 1`을 한 번 실행한다(PR-S-08, PD-14).

        관련 ID: P-25, PD-14, PR-S-05, PR-S-08, T-BE-03
      security: []
      responses:
        '200':
          description: 기동 중이고 DB에 연결됨.
          content:
            application/json:
              schema:
                type: object
                required: [ok, db]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  db:
                    type: string
                    enum: [up]
              example:
                ok: true
                db: up
        '503':
          description: 기동 중이지만 DB를 쓸 수 없음. NFR-15 오류 형식이 아닌 상태 본문이다.
          content:
            application/json:
              schema:
                type: object
                required: [ok, db]
                properties:
                  ok:
                    type: boolean
                    enum: [false]
                  db:
                    type: string
                    enum: [down]
              example:
                ok: false
                db: down

  /api/docs:
    get:
      tags: [docs]
      operationId: getDocs
      summary: Swagger UI(개발 환경 한정)
      description: |
        `NODE_ENV=development`일 때만 등록되는 Swagger UI HTML이다. UI 스크립트는 CDN(`swagger-ui-dist@5.17.14`)에서 받는다. 그 밖의 환경에서는 등록하지 않아 404 `NOT_FOUND`다(PD-30).

        관련 ID: PD-30, PR-S-05
      security: []
      responses:
        '200':
          description: Swagger UI 페이지.
          content:
            text/html:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /api/docs/swagger.yaml:
    get:
      tags: [docs]
      operationId: getSpec
      summary: OpenAPI 명세 원본(개발 환경 한정)
      description: |
        이 파일(`backend/swagger.yaml`)을 그대로 돌려준다. `NODE_ENV=development`일 때만 등록되고 그 밖의 환경에서는 404 `NOT_FOUND`다(PD-30).

        관련 ID: PD-30
      security: []
      responses:
        '200':
          description: OpenAPI 3.0.3 YAML.
          content:
            text/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        access 토큰 JWT(HS384, 페이로드 `sub`만, 만료 15분). httpOnly 쿠키라 브라우저가 자동으로 보낸다. 서버는 `algorithms: ['HS384']`로만 검증한다(PR-S-03).

  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: 할일 ID(정수). 정수가 아니거나 없거나 타인 소유면 404 `NOT_FOUND`(PD-13, BR-03).
      schema:
        type: integer
      example: 1
    CategoryId:
      name: id
      in: path
      required: true
      description: 카테고리 ID(정수). 정수가 아니거나 없거나 타인 소유면 404 `NOT_FOUND`(PD-13, BR-03).
      schema:
        type: integer
      example: 2
    Today:
      name: today
      in: query
      required: true
      description: 상태 판정 기준 날짜. 사용자 단말의 현지 날짜(`YYYY-MM-DD`, 실제 날짜). 없거나 잘못되면 400 `VALIDATION_ERROR`(P-12, NFR-12).
      schema:
        $ref: '#/components/schemas/Date'
      example: '2026-11-04'
    RefreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: refresh 토큰(불투명 base64url 문자열, `Path=/api/auth`). 없으면 401 `UNAUTHORIZED`(T-BE-16).
      schema:
        type: string
    RefreshTokenCookieOptional:
      name: refresh_token
      in: cookie
      required: false
      description: refresh 토큰. 없거나 이미 무효여도 로그아웃은 204다(T-BE-08).
      schema:
        type: string

  headers:
    SetAuthCookies:
      description: |
        토큰 쌍 쿠키 발급. 실제 응답에는 `Set-Cookie` 헤더가 두 개 온다(P-04, PR-S-03).
        - `access_token=<JWT>; Path=/; Max-Age=900; HttpOnly; SameSite=Lax`
        - `refresh_token=<opaque>; Path=/api/auth; Max-Age=604800; HttpOnly; SameSite=Lax`
        `NODE_ENV=production`이면 둘 다 `Secure`가 붙는다.
      schema:
        type: string
      example: access_token=eyJhbGciOiJIUzM4NCJ9...; Path=/; Max-Age=900; HttpOnly; SameSite=Lax
    ClearAuthCookies:
      description: |
        두 쿠키를 발급 때와 같은 `Path`·옵션으로 삭제한다. 실제 응답에는 `Set-Cookie` 헤더가 두 개 온다(PR-S-03).
        - `access_token=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax`
        - `refresh_token=; Path=/api/auth; Max-Age=0; HttpOnly; SameSite=Lax`
      schema:
        type: string
      example: access_token=; Path=/; Max-Age=0; HttpOnly; SameSite=Lax

  schemas:
    Date:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: '`YYYY-MM-DD` 문자열. 실제 존재하는 날짜여야 한다(`2026-13-01`, `2026-02-30`, `2026-1-1`은 오류)(NFR-11, T-BE-04).'
      example: '2026-11-04'

    Timestamp:
      type: string
      format: date-time
      description: TIMESTAMPTZ 시각. ISO 8601 UTC, `toISOString()` 형식(PD-28).
      example: '2026-11-04T01:00:00.000Z'

    TodoStatus:
      type: string
      enum: [completed, not_started, in_progress, overdue]
      description: |
        할일 상태(파생값, 저장 안 함). ST-01 `completed`(완료), ST-02 `not_started`(시작 전), ST-03 `in_progress`(진행 중), ST-04 `overdue`(지연)(PD-19).

    User:
      type: object
      description: 사용자. `createdAt`·`updatedAt`을 항상 포함하고 비밀번호 해시는 포함하지 않는다(PR-S-06, PD-29, ERD 7장).
      required: [id, email, name, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          maxLength: 254
          description: 로그인 ID. 소문자로 저장(DB-03). 변경 불가(BR-05).
        name:
          type: string
          minLength: 1
          maxLength: 50
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 이메일 형식, trim 후 254자 이하. 소문자로 정규화해 저장(BR-22, NFR-09, DB-03).
        password:
          type: string
          minLength: 8
          maxLength: 64
          description: 8자 이상 64자 이하, 문자 조합 제한 없음(BR-21). trim하지 않으며 공백도 문자로 센다(BR-22).
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: trim 후 1~50자. 공백만 있으면 누락(BR-22).

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: 필수(FR-02, T-BE-04). 소문자로 비교한다(DB-03).
        password:
          type: string
          description: 필수(FR-02, T-BE-04). trim하지 않는다(BR-22).

    UpdateMeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: trim 후 1~50자(BR-22).

    ChangePasswordRequest:
      type: object
      description: 비밀번호 변경 본문(ERD 7장). 두 값 모두 trim하지 않는다(BR-22). 새 비밀번호 확인값은 보내지 않는다(P-24).
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          description: 현재 비밀번호. 틀리면 400 `INVALID_PASSWORD`(BR-05).
        newPassword:
          type: string
          minLength: 8
          maxLength: 64
          description: 새 비밀번호, 8~64자(BR-21).

    Category:
      type: object
      required: [id, name, isDefault, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: 업무
        isDefault:
          type: boolean
          description: 기본 카테고리 여부. 사용자당 정확히 1개만 true(BR-10, BR-12).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    CategoryNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: trim 후 1~30자. 같은 사용자 안에서 유일(대소문자 구분, '기본' 포함)(BR-13, BR-22, DB-04).

    Todo:
      type: object
      description: |
        할일. 모든 할일 응답(단건 조회·등록·수정·완료 토글·목록·캘린더)이 이 스키마를 쓴다(PD-29).
        `status`는 `today`를 받는 목록·캘린더 응답에만 있다(PD-13, NFR-12).
      required:
        [
          id,
          categoryId,
          categoryName,
          title,
          description,
          startDate,
          endDate,
          completed,
          completedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
          example: 1
        categoryId:
          type: integer
          example: 2
        categoryName:
          type: string
          maxLength: 30
          description: 카테고리 이름(JOIN, PR-L-08). `category_id`가 NOT NULL이라 항상 값이 있다(PD-29).
          example: 업무
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 빈 값은 `null`(DB-11).
        startDate:
          $ref: '#/components/schemas/Date'
        endDate:
          $ref: '#/components/schemas/Date'
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 완료 처리 시각(기록용, PD-28 형식). `completed=false`면 `null`(PD-21, DB-08).
        status:
          $ref: '#/components/schemas/TodoStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    TodoInput:
      type: object
      description: 할일 등록·수정 본문. 수정도 폼 값 전체를 보낸다(PD-20). `userId`·`completed`는 받지 않는다(BR-03, PR-S-07).
      required: [title, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: trim 후 1~100자. 공백만 있으면 누락(BR-06, BR-22).
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 선택, trim 후 0~1000자. 빈 문자열은 `null`로 저장(BR-22, DB-11). `null`은 등록에서 생략과 같고 수정에서 값을 비운다(PD-27). 수정에서 생략하면 기존 값 유지(PD-20).
        startDate:
          $ref: '#/components/schemas/Date'
        endDate:
          allOf:
            - $ref: '#/components/schemas/Date'
          description: '`startDate` 이상(같은 날 허용)(BR-07).'
        categoryId:
          type: integer
          description: 선택. 본인 카테고리만(BR-04, 아니면 404). 생략 시 등록은 기본 카테고리, 수정은 기존 유지(BR-11). `null`은 400(NOT NULL 컬럼, PD-27).

    CompletedRequest:
      type: object
      required: [completed]
      properties:
        completed:
          type: boolean
          description: boolean이 아니면 400 `VALIDATION_ERROR`(T-BE-11).

    ErrorCode:
      type: string
      description: NFR-15 오류 코드.
      enum:
        - VALIDATION_ERROR
        - DEFAULT_CATEGORY_IMMUTABLE
        - INVALID_PASSWORD
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - NOT_FOUND
        - DUPLICATE_EMAIL
        - DUPLICATE_CATEGORY
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      description: 공통 오류 응답(NFR-15, P-13). 화면은 `code`로 분기하고 `message`·`fields`를 그대로 표시한다(PR-C-04).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 사용자 표시 문구.
            fields:
              type: object
              description: '`VALIDATION_ERROR`일 때만. 입력 필드 이름 → 사유 문구. 여러 오류를 함께 담는다(PD-22, PR-N-09).'
              additionalProperties:
                type: string

  responses:
    BodyValidationError:
      description: |
        본문 입력 위반. `fields`에 항목별 사유(NFR-15, PD-22). NOT NULL 필드의 `null`도 해당한다(PD-27).
        JSON 파싱 실패와 본문 16kb 초과(`express.json`의 413 `entity.too.large`를 오류 미들웨어가 변환)도 400 `VALIDATION_ERROR`이며 이때는 `fields`가 없다(PR-S-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fields:
              summary: 항목별 입력 위반
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요.
                  fields:
                    title: 필수 항목입니다.
                    endDate: 종료일은 시작일과 같거나 이후여야 합니다.
            tooLarge:
              summary: 본문 16kb 초과
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 요청 본문이 너무 큽니다.
            parseFailed:
              summary: JSON 파싱 실패
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 요청 본문이 올바른 JSON이 아닙니다.
    ValidationError:
      description: 쿼리 파라미터 입력 위반(형식 오류, `today` 누락, `from > to` 등). `fields`에 항목별 사유(NFR-15, PD-13, P-12, P-14).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: 입력값을 확인해 주세요.
              fields:
                today: 날짜 형식(YYYY-MM-DD)이 올바르지 않습니다.
    ValidationOrDefaultCategoryError:
      description: 입력 위반(`VALIDATION_ERROR`, JSON 파싱 실패·본문 16kb 초과 포함, PR-S-07) 또는 기본 카테고리 이름 변경 시도(`DEFAULT_CATEGORY_IMMUTABLE`, BR-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validation:
              summary: 이름 31자 또는 공백만(E-03-3)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요.
                  fields:
                    name: 1자 이상 30자 이하여야 합니다.
            defaultCategory:
              summary: 기본 카테고리 이름 변경(E-03-2)
              value:
                error:
                  code: DEFAULT_CATEGORY_IMMUTABLE
                  message: 기본 카테고리는 수정하거나 삭제할 수 없습니다.
    Unauthorized:
      description: access 토큰 쿠키 없음·만료·위조(FR-04, PR-S-05). 화면은 `POST /api/auth/refresh` 후 1회 재요청한다(PR-L-12).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: 로그인이 필요합니다.
    NotFound:
      description: 대상이 없거나 타인 소유(존재 여부 비노출, BR-03, NFR-07). 정수가 아닌 `:id` 포함(PD-13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: 대상을 찾을 수 없습니다.
    DuplicateCategory:
      description: 같은 사용자 안에 같은 이름의 카테고리가 있음('기본' 포함, BR-13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DUPLICATE_CATEGORY
              message: 이미 있는 카테고리 이름입니다.
    InternalError:
      description: 서버 내부 오류. 내부 상세는 응답에 넣지 않고 서버 로그에만 남긴다(NFR-15, PR-S-08).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: 일시적인 오류가 발생했습니다.
